name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - name: Install test dependencies
        run: apt-get update -qq && apt-get install -y --no-install-recommends bash ca-certificates curl git openssh-client python3 python3-venv shellcheck shfmt tar zsh
      - uses: actions/checkout@v4
        with:
          path: manager
      - uses: actions/checkout@v4
        with:
          repository: jeremyspofford/dotfiles
          ref: main
          path: content
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: jeremyspofford/dotfiles-archive
          ref: legacy/stow-local-2026
          path: archive
          ssh-key: ${{ secrets.DOTFILES_ARCHIVE_SSH_KEY }}
          persist-credentials: false
      - name: Prepare local content origins
        shell: bash
        run: |
          git config --system --add safe.directory '*'
          git -C content checkout -B fixture-content
          git -C archive checkout -B fixture-archive
          test "$(git -C archive rev-parse HEAD)" = 16477c53fa6bc200b329430f2bac732cdaecee15
      - name: Check shell scripts
        working-directory: manager
        run: |
          shellcheck install.sh scripts/*.sh
          shfmt -d install.sh scripts/*.sh
          bash install.sh --help
          bash scripts/apply.sh --help
          bash scripts/generate-agent-configs.sh --help
          bash scripts/release.sh --help
      - name: Cold install and rerun without config-template warnings
        shell: bash
        run: |
          export HOME="$RUNNER_TEMP/cold-home"
          mkdir -p "$HOME"
          for attempt in first second; do
            bash manager/install.sh --repo "$GITHUB_WORKSPACE/content" --defaults --machine-name container-test --domain core --git-name "Container Test" --git-email container@example.invalid > "$RUNNER_TEMP/install-$attempt.log" 2>&1
            cat "$RUNNER_TEMP/install-$attempt.log"
            if grep -Fq 'config file template has changed' "$RUNNER_TEMP/install-$attempt.log"; then exit 1; fi
            export PATH="$HOME/.local/bin:$PATH"
            chezmoi status > "$RUNNER_TEMP/status-$attempt.log" 2>&1
            test ! -s "$RUNNER_TEMP/status-$attempt.log"
          done
          python3 - <<'PY'
          import os
          from pathlib import Path
          folder = Path(os.environ['RUNNER_TEMP'])
          first = (folder / 'install-first.log').read_text()
          second = (folder / 'install-second.log').read_text()
          for number, name in enumerate(['Software', 'Manager and content', 'Files', 'Profile changes', 'Locations', 'Next steps'], 1):
              assert f'{number} · {name}' in first and f'{number} · {name}' in second
          assert '4 installed.' in first
          assert '7 · Enrollment' in first and 'check: ' in first
          assert 'Fleet TUI (Textual)' in first
          assert '~/.local/bin/chezmoi' in first
          assert '~/.local/bin/mise' in first
          for number, name in enumerate(['Software', 'Manager and content', 'Files', 'Profile changes'], 1):
              assert f'{number} · {name} — no changes.' in second
          assert 'chezmoi status: clean · warnings: none' in second
          import json
          records = sorted(Path(os.environ['HOME']).glob('.fleet/backups/*/RUN.json'))
          for path, action in zip(records, ['installed', 'present']):
              record = json.loads(path.read_text())
              runtime = next(item for item in record['software'] if item['name'] == 'Fleet TUI (Textual)')
              assert runtime['action'] == action
              assert Path(runtime['path'], 'bin/python').is_file()
          PY
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "FLEET_TEST_TUI_ENV=$HOME/.fleet/tui" >> "$GITHUB_ENV"
      - name: Keep the CLI free of Textual
        run: python3 -c "import importlib.util; assert importlib.util.find_spec('textual') is None"
      - name: Test real content, archive, native source, prompts, and repeat runs
        working-directory: manager
        env:
          DOTFLEET_CONTENT_FIXTURE: ${{ github.workspace }}/content
          DOTFLEET_ARCHIVE_FIXTURE: ${{ github.workspace }}/archive
        run: python3 -m unittest discover -s tests -v
      - name: Install Textual for pilot tests
        working-directory: manager
        run: |
          python3 -m venv "$RUNNER_TEMP/tui-tests"
          "$RUNNER_TEMP/tui-tests/bin/python" -m pip install -r requirements-tui.txt
      - name: Test terminal screens with the Textual pilot
        working-directory: manager
        env:
          DOTFLEET_CONTENT_FIXTURE: ${{ github.workspace }}/content
          DOTFLEET_ARCHIVE_FIXTURE: ${{ github.workspace }}/archive
        run: '"$RUNNER_TEMP/tui-tests/bin/python" -m unittest discover -s tests/tui -v'
  release-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run test:release
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.15.21
      - run: ruff format --check scripts tests
      - run: npx --yes prettier@3.6.2 --check 'scripts/*.cjs' 'tests/*.cjs'
  bash-3-2:
    # The bootstrap layer must run on bash 3.2, the bash that macOS ships. Docker runs it here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: docker pull -q bash:3.2
      - run: python -m unittest -v test_bash_floor
        working-directory: tests
        env:
          FLEET_REQUIRE_DOCKER: '1'
